# Build the Astro site and deploy it to GitHub Pages — entirely on GitHub's
# runners (several GB of RAM), NEVER on the personal-assistant worker (512 MB,
# where the local `npm install` OOM-killed the process). This is the fix: the
# heavy install/build happens here in CI.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let one deploy finish; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        # enablement:true makes the workflow's own GITHUB_TOKEN (pages:write)
        # turn ON Pages and set it to "GitHub Actions" (workflow) build mode —
        # even if it was auto-enabled in legacy/branch mode. This is why no repo
        # admin / PAT change is needed to switch the Pages source.
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build with Astro
        uses: withastro/action@v3
        with:
          # No lockfile is committed, so the action can't auto-detect the
          # package manager — tell it explicitly. It then runs npm install +
          # `astro build` and uploads the Pages artifact.
          package-manager: npm@latest

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
