# Build the Astro site and deploy it to GitHub Pages — entirely on GitHub's
# runners (several GB of RAM), NEVER on the personal-assistant worker (512 MB,
# where the local `npm install` OOM-killed the process). This is the fix: the
# heavy install/build happens here in CI.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let one deploy finish; don't cancel an in-progress production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with Astro
        uses: withastro/action@v3
        # withastro/action runs the install (npm) + `astro build` and uploads
        # the artifact. No package-lock is committed, so it runs `npm install`.

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
